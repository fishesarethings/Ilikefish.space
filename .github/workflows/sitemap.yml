name: Generate SEO files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate SEO files
        env:
          BASE_URL: "https://ilikefish.space"
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');

          const BASE = process.env.BASE_URL;
          const now = new Date().toISOString().slice(0, 10);
          const urls = new Map();

          const addUrl = (loc, freq = 'monthly', prio = '0.6') => {
            urls.set(loc, { loc, changefreq: freq, priority: prio });
          };

          [
            ['/', 'weekly', '1.0'],
            ['/games/', 'weekly', '0.9'],
            ['/gamepack/', 'monthly', '0.7'],
            ['/about.html', 'monthly', '0.6'],
            ['/contact.html', 'monthly', '0.6'],
            ['/privacy.html', 'yearly', '0.3'],
            ['/terms.html', 'yearly', '0.3']
          ].forEach(([p, freq, prio]) => addUrl(BASE + p, freq, prio));

          const sitemap =
            `<?xml version="1.0" encoding="UTF-8"?>\n` +
            `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n` +
            [...urls.values()].map(u =>
              `  <url>\n` +
              `    <loc>${u.loc}</loc>\n` +
              `    <lastmod>${now}</lastmod>\n` +
              `    <changefreq>${u.changefreq}</changefreq>\n` +
              `    <priority>${u.priority}</priority>\n` +
              `  </url>`
            ).join('\n') +
            `\n</urlset>\n`;

          fs.writeFileSync('sitemap.xml', sitemap);
          fs.writeFileSync(
            'robots.txt',
            `# AI-readable summary: ${BASE}/llms.txt\nUser-agent: *\nAllow: /\n\nSitemap: ${BASE}/sitemap.xml\n`
          );

          console.log(`Generated sitemap.xml with ${urls.size} URLs`);
          console.log('Generated robots.txt');
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No SEO changes"
            exit 0
          fi
          git commit -m "chore: update sitemap and robots.txt"
          git push
